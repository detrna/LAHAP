services:
    postgres:
        image: postgres:17-alpine
        container_name: postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_NAME}
        ports:
            - "127.0.0.1:${DB_PORT:-5432}:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
            interval: 10s
            timeout: 5s
            retries: 5

    seaweedfs:
        image: chrislusf/seaweedfs
        container_name: seaweedfs
        restart: unless-stopped
        command: server -dir=/data -s3
        environment:
            AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
            AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
        ports:
            - "${S3_BIND:-127.0.0.1}:8333:8333" # S3 API
            - "127.0.0.1:9333:9333" # master UI
            - "127.0.0.1:8888:8888" # filer UI (browse buckets and files)
        volumes:
            - seaweedfs_data:/data

    redis:
        image: redis:7-alpine
        container_name: redis
        restart: unless-stopped
        command: redis-server --appendonly yes --maxmemory-policy noeviction
        ports:
            - "127.0.0.1:${REDIS_PORT:-6379}:6379"
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5

    api:
        image: ghcr.io/${IMAGE_NAME:-detrna/lahap-backend}:${IMAGE_TAG:-local}
        build: .
        profiles: ["app"]
        restart: unless-stopped
        env_file:
            - path: .env
              required: false
        environment:
            DB_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
            REDIS_URL: redis://redis:6379
            LOG_FILE_PATH: log/api.txt
        ports:
            - "${API_BIND:-127.0.0.1}:${PORT:-4000}:${PORT:-4000}"
        volumes:
            - app_logs:/app/log
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            seaweedfs:
                condition: service_started
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "fetch('http://localhost:' + (process.env.PORT ?? 4000) + '/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
                ]
            interval: 10s
            timeout: 5s
            retries: 6
            start_period: 15s

    worker:
        image: ghcr.io/${IMAGE_NAME:-detrna/lahap-backend}:${IMAGE_TAG:-local}
        build: .
        profiles: ["app"]
        restart: unless-stopped
        command: ["node", "dist/worker.js"]
        env_file:
            - path: .env
              required: false
        environment:
            DB_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
            REDIS_URL: redis://redis:6379
            LOG_FILE_PATH: log/worker.txt
        volumes:
            - app_logs:/app/log
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

volumes:
    app_logs:
    postgres_data:
    seaweedfs_data:
    redis_data:
