<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kotak masuk · LAHAP</title><link rel="stylesheet" href="css/style.css"></head><body data-roles="admin">
<header class="app-header"><div class="container"><a class="brand" href="admin.html">LAHAP</a><nav class="nav"></nav></div></header>
<main class="container stack-lg">
<div class="row-between"><div><h1 class="t-h1">Kotak masuk</h1><p class="t-muted">Pengingat menu kosong, pembayaran yang perlu direfund, dan pengantaran yang perlu kurir.</p></div><button class="btn btn-secondary" id="semua" type="button" disabled>Tandai Semua Dibaca</button></div>
<div class="alert alert--error" id="err" role="alert" hidden><span class="alert-title">Gagal</span><span class="msg"></span></div>
<div class="chip-group" id="filter" role="radiogroup" aria-label="Filter notifikasi"><label class="chip"><input type="radio" name="f" value="" checked>Semua</label><label class="chip"><input type="radio" name="f" value="false">Belum dibaca</label></div>
<section class="stack"><p class="t-muted" id="kosong" hidden>Belum ada notifikasi.</p><div class="stack" id="notif" aria-live="polite"><div class="skeleton"></div><div class="skeleton"></div></div><div id="pager" hidden></div></section>
</main>
<script src="js/auth.js"></script>
<script>
const $ = selector => document.querySelector(selector);
const waktu = s => new Date(s).toLocaleString("id-ID", { timeZone: "Asia/Jakarta", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
const el = (tag, c, t) => { const n = document.createElement(tag); if (c) n.className = c; if (t !== undefined) n.textContent = t; return n; };
function galat(error) { $("#err").hidden = !error; if (error) $("#err .msg").textContent = errorMessage(error); }
const lonceng = () => { if (window.perbaruiLonceng) window.perbaruiLonceng(); };

function kartu(n) {
    const box = el("div", n.isRead ? "card" : "alert alert--info");
    box.append(el("span", "alert-title", n.title), n.body, el("p", "t-small t-muted", waktu(n.createdAt)));
    if (!n.isRead) {
        box.style.cursor = "pointer";
        box.tabIndex = 0;
        box.setAttribute("role", "button");
        box.append(el("span", "sr-only", "Belum dibaca. Tekan untuk menandai sudah dibaca."));
        const tandai = async () => {
            if (box.dataset.sibuk) return;
            box.dataset.sibuk = "1";
            try {
                await api(`/me/notifications/${n.id}/read`, { method: "POST" });
                lonceng();
                muat();
            } catch (error) {
                delete box.dataset.sibuk;
                galat(error);
            }
        };
        box.onclick = tandai;
        box.onkeydown = event => { if (event.key === "Enter" || event.key === " ") { event.preventDefault(); tandai(); } };
    }
    return box;
}

let halaman = 1;
async function muat() {
    const f = document.querySelector("#filter input:checked").value;
    try {
        const { data, meta } = await api(`/me/notifications?page=${halaman}&limit=20${f ? `&isRead=${f}` : ""}`);
        $("#notif").replaceChildren(...data.map(kartu));
        $("#kosong").hidden = data.length > 0;
        $("#semua").disabled = !meta.unreadCount;
        renderPager($("#pager"), meta, p => { halaman = p; muat(); });
        galat(null);
    } catch (error) {
        $("#notif").replaceChildren();
        galat(error);
    }
}

$("#semua").onclick = async event => {
    const tombol = event.currentTarget;
    tombol.disabled = true;
    try {
        await api("/me/notifications/read-all", { method: "POST" });
        lonceng();
        await muat();
    } catch (error) {
        tombol.disabled = false;
        galat(error);
    }
};
$("#filter").addEventListener("change", () => { halaman = 1; muat(); });
muat();
</script></body></html>
