<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Menu · LAHAP</title><link rel="stylesheet" href="css/style.css"></head><body data-roles="admin">
<header class="app-header"><div class="container"><a class="brand" href="admin.html">LAHAP</a><nav class="nav"></nav></div></header>
<main class="container stack-lg">
<h1 class="t-h1">Menu dan jadwal</h1>
<div class="alert alert--error" id="err" role="alert" hidden><span class="alert-title">Gagal</span><span class="msg"></span></div>
<form class="card stack" id="form" novalidate>
 <h2 class="t-h3">Tambah jadwal menu</h2>
 <div class="grid grid-2">
  <div class="field" id="fTg"><label for="tg">Tanggal</label><input class="input" id="tg" type="date"><p class="error-msg" hidden>Pilih tanggal.</p></div>
  <div class="field"><label for="pk">Paket</label><select class="select input" id="pk"></select></div>
  <div class="field"><label for="wk">Waktu makan</label><select class="select input" id="wk"></select></div>
  <div class="field" id="fMn"><label for="mn">Menu utama</label><select class="select input" id="mn"></select><p class="error-msg" hidden>Belum ada menu. Tambahkan menu dulu.</p></div>
  <div class="field"><label for="alt">Menu alternatif (untuk pelanggan beralergi)</label><select class="select input" id="alt"><option value="">Tanpa menu alternatif</option></select></div>
 </div>
 <div class="row"><button class="btn btn-secondary" type="submit" id="draft">Simpan sebagai Draft</button><button class="btn btn-primary" type="button" id="terbitLangsung">Simpan dan Terbitkan</button></div>
</form>
<section class="card">
 <div class="section-head"><h2 class="t-h2">Jadwal mendatang</h2><span class="t-small t-muted">Pelanggan hanya melihat yang terbit</span></div>
 <p class="t-muted" id="kosong" hidden>Belum ada jadwal. Tambahkan lewat form di atas.</p>
 <div id="jadwal" aria-busy="true"><div class="skeleton"></div></div>
</section>
</main><script src="js/auth.js"></script>
<script>
const $ = s => document.querySelector(s);
const hariIni = () => new Date().toLocaleDateString("sv-SE", { timeZone: "Asia/Jakarta" });
const el = (tag, c, t) => { const n = document.createElement(tag); if (c) n.className = c; if (t !== undefined) n.textContent = t; return n; };
const hari = s => new Date(`${s}T00:00:00+07:00`).toLocaleDateString("id-ID", { timeZone: "Asia/Jakarta", weekday: "long", day: "numeric", month: "short" });
function galat(error) { $("#err").hidden = !error; if (error) $("#err .msg").textContent = errorMessage(error); }
function setBadge2(b, kelas, teks) { b.className = `badge ${kelas}`; b.textContent = teks; }

let paket = [], menus = [];
const namaPaket = id => (paket.find(p => p.id === id) || {}).name || "Paket";

function isiWaktu() {
    const p = paket.find(x => x.id === $("#pk").value);
    $("#wk").replaceChildren(...((p && p.deliveryTimes) || []).map(t => { const o = el("option", "", `${t.range} · ${t.time}`); o.value = t.time; return o; }));
}

function baris(j) {
    const slot = el("div", "slot");
    const utama = (j.menus || []).find(m => m.isPrimary);
    const alt = (j.menus || []).find(m => !m.isPrimary);
    const kiri = el("div");
    kiri.append(
        el("p", "t-h3", `${hari(j.date)} · ${j.deliveryTime.range} · ${namaPaket(j.packageId)}`),
        el("p", "t-small t-muted", `${utama && utama.menu ? utama.menu.name : "Menu belum diisi"}${alt && alt.menu ? ` · alternatif: ${alt.menu.name}` : ""}`),
    );
    const kanan = el("div", "row");
    const badge = el("span", "");
    setBadge2(badge, j.isPublished ? "badge--success" : "badge--pending", j.isPublished ? "Terbit" : "Draft");
    const tombol = el("button", `btn btn-sm ${j.isPublished ? "btn-secondary" : "btn-primary"}`, j.isPublished ? "Batalkan Terbit" : "Terbitkan");
    tombol.type = "button";
    tombol.onclick = async () => {
        if (j.isPublished && !confirm("Batalkan terbit jadwal ini? Hanya bisa jika belum ada pesanan.")) return;
        tombol.disabled = true;
        galat(null);
        try {
            await api("/admin/menu-schedules/publish", { method: "POST", body: { ids: [j.id], publish: !j.isPublished } });
            toast(j.isPublished ? "Jadwal dikembalikan ke draft." : "Jadwal diterbitkan.");
            muat();
        } catch (error) { tombol.disabled = false; galat(error); }
    };
    kanan.append(badge, tombol);
    slot.append(kiri, kanan);
    return slot;
}

async function muat() {
    try {
        const { data } = await api(`/admin/menu-schedules?from=${hariIni()}&limit=100`);
        data.sort((a, b) => a.date.localeCompare(b.date) || a.deliveryTime.time.localeCompare(b.deliveryTime.time));
        $("#jadwal").removeAttribute("aria-busy");
        $("#jadwal").replaceChildren(...data.map(baris));
        $("#kosong").hidden = data.length > 0;
        galat(null);
    } catch (error) {
        $("#jadwal").removeAttribute("aria-busy");
        $("#jadwal").replaceChildren();
        galat(error);
    }
}

async function awal() {
    try {
        const [pk, mn] = await Promise.all([api("/admin/packages?limit=100"), api("/admin/menus?limit=100")]);
        paket = pk.data;
        menus = mn.data;
        $("#pk").replaceChildren(...paket.map(p => { const o = el("option", "", p.name); o.value = p.id; return o; }));
        $("#mn").replaceChildren(...menus.filter(m => !m.isAlternative).map(m => { const o = el("option", "", m.name); o.value = m.id; return o; }));
        $("#alt").append(...menus.filter(m => m.isAlternative).map(m => { const o = el("option", "", m.name); o.value = m.id; return o; }));
        isiWaktu();
    } catch (error) { galat(error); }
    muat();
}

async function simpan(terbit) {
    const tg = $("#tg");
    const ok = tg.value !== "" && $("#mn").value !== "" && $("#wk").value !== "";
    $("#fTg").classList.toggle("is-error", tg.value === "");
    $("#fTg .error-msg").hidden = tg.value !== "";
    $("#fMn").classList.toggle("is-error", $("#mn").value === "");
    $("#fMn .error-msg").hidden = $("#mn").value !== "";
    tg.setAttribute("aria-invalid", String(tg.value === ""));
    if (!ok) return (tg.value === "" ? tg : $("#mn")).focus();
    const item = { packageId: $("#pk").value, date: tg.value, deliveryTime: $("#wk").value, primaryMenuId: $("#mn").value, isPublished: terbit };
    if ($("#alt").value) item.alternativeMenuId = $("#alt").value;
    galat(null);
    document.querySelectorAll("#form button").forEach(b => (b.disabled = true));
    try {
        await api("/admin/menu-schedules", { method: "POST", body: { items: [item] } });
        toast(terbit ? "Jadwal disimpan dan diterbitkan." : "Draft disimpan.");
        muat();
    } catch (error) { galat(error); }
    finally { document.querySelectorAll("#form button").forEach(b => (b.disabled = false)); }
}
$("#pk").addEventListener("change", isiWaktu);
$("#form").onsubmit = event => { event.preventDefault(); simpan(false); };
$("#terbitLangsung").onclick = () => simpan(true);
awal();
</script></body></html>
