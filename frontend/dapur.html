<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>To-do dapur · LAHAP</title><link rel="stylesheet" href="css/style.css"></head><body data-roles="dapur,admin">
<header class="app-header"><div class="container"><a class="brand" href="dapur.html">LAHAP</a><nav class="nav"></nav></div></header>
<main class="container stack-lg">
<div><h1 class="t-h1">To-do dapur</h1><p class="t-muted">Rekap produksi, bahan yang dibutuhkan, dan pesanan dengan alergi atau catatan khusus.</p></div>
<div class="field"><label for="tgl">Tanggal layanan</label><input class="input" id="tgl" type="date"></div>
<div class="alert alert--error" id="err" role="alert" hidden><span class="alert-title">Gagal</span><span class="msg"></span></div>
<p class="t-muted" id="kosong" hidden>Tidak ada yang perlu dimasak pada tanggal ini.</p>
<div class="stack-lg" id="daftar" aria-live="polite" aria-busy="true"><div class="skeleton"></div><div class="skeleton"></div></div>
</main>
<script src="js/auth.js"></script>
<script>
const $ = s => document.querySelector(s);
const hariIni = () => new Date().toLocaleDateString("sv-SE", { timeZone: "Asia/Jakarta" });
const angka = n => Number(n).toLocaleString("id-ID", { maximumFractionDigits: 2 });
const tglPanjang = s => new Date(`${s}T00:00:00+07:00`).toLocaleDateString("id-ID", { timeZone: "Asia/Jakarta", weekday: "long", day: "numeric", month: "long" });
const ALASAN = { ALLERGY_CLASH: "Bentrok alergi", ALLERGY_NOTE: "Catatan alergi", NOTE: "Catatan" };

function el(tag, className, text) {
    const n = document.createElement(tag);
    if (className) n.className = className;
    if (text !== undefined) n.textContent = text;
    return n;
}
function galat(error) {
    $("#err").hidden = !error;
    if (error) $("#err .msg").textContent = typeof error === "string" ? error : errorMessage(error);
}

// Id jadwal tidak ada di data masak, jadi diambil dari jadwal terbit paket itu (cache per muat).
let cacheJadwal = new Map();
async function idJadwal(packageId, tanggal, jam) {
    if (!cacheJadwal.has(packageId)) cacheJadwal.set(packageId, (await api(`/packages/${packageId}/schedules`, { auth: false })).data);
    const j = cacheJadwal.get(packageId).find(x => x.date === tanggal && (!jam || x.deliveryTime.time === jam));
    return j && j.id;
}

let sibuk = false;
async function jalankan(aksi, tombol, pesan) {
    if (sibuk) return;
    sibuk = true;
    if (tombol) tombol.disabled = true;
    galat(null);
    try {
        await aksi();
        if (pesan) toast(pesan);
        await muat();
    } catch (error) {
        galat(error);
    } finally {
        sibuk = false;
        if (tombol) tombol.disabled = false;
    }
}

function barisMenu(g, m) {
    const row = el("div", "invoice");
    const kiri = el("div");
    kiri.append(
        el("p", "label", `${m.packageName}${m.isAlternative ? " · menu alternatif" : ""}`),
        el("p", "t-h3", m.name),
        el("p", "t-small t-muted", (m.components || []).map(c => c.name + (c.cook ? ` (${c.cook.name})` : "")).join(" · ")),
    );
    const kanan = el("div", "row");
    kanan.append(el("span", "t-h3", `${m.portions} porsi`));
    const siap = el("button", "btn btn-primary btn-sm", "Makanan Siap");
    siap.type = "button";
    siap.onclick = () => {
        if (!confirm(`Tandai ${m.portions} porsi "${m.name}" siap? Slot Disiapkan jadi Diantar atau Siap Diambil.`)) return;
        jalankan(async () => {
            const id = await idJadwal(m.packageId, g.date, g.deliveryTime && g.deliveryTime.time);
            if (!id) throw new Error("Jadwal untuk menu ini tidak ditemukan.");
            const { data } = await api("/kitchen/food-ready", { method: "POST", body: { menuScheduleId: id, usesAlternativeMenu: m.isAlternative } });
            toast(`${data.updatedCount} slot ditandai siap.`);
        }, siap);
    };
    kanan.append(siap);
    row.append(kiri, kanan);
    return row;
}

function kartuKhusus(s) {
    const box = el("div", "alert alert--warning stack");
    box.append(el("span", "alert-title", `${s.recipientName} · ${s.isDelivery ? "Diantar" : "Ambil sendiri"}${s.packageName ? ` · ${s.packageName}` : ""}`));
    const info = [];
    s.reasons.forEach(r => info.push(ALASAN[r] || r));
    box.append(el("p", "t-small", info.join(", ")));
    if ((s.conflictingAllergies || []).length) box.append(el("p", "", `Alergi bentrok: ${s.conflictingAllergies.map(a => a.name).join(", ")}`));
    if (s.allergyNote) box.append(el("p", "", `Catatan alergi: ${s.allergyNote}`));
    if (s.note) box.append(el("p", "", `Catatan: ${s.note}`));
    const aksi = el("div", "task-actions");
    if (s.reasons.includes("ALLERGY_CLASH")) {
        if (!s.alternativeMenuId && !s.usesAlternativeMenu) aksi.append(el("p", "t-small", "Jadwal ini belum punya menu alternatif."));
        else {
            const alt = el("button", "btn btn-secondary btn-sm", s.usesAlternativeMenu ? "Batalkan Menu Alternatif" : "Pakai Menu Alternatif");
            alt.type = "button";
            alt.onclick = () =>
                jalankan(() => api(`/kitchen/orders/${s.orderId}/alternative-menu`, { method: s.usesAlternativeMenu ? "DELETE" : "POST" }), alt, s.usesAlternativeMenu ? "Menu alternatif dibatalkan." : "Menu alternatif dipakai.");
            aksi.append(alt);
        }
    }
    const siap = el("button", "btn btn-primary btn-sm", "Siap");
    siap.type = "button";
    siap.onclick = () => jalankan(() => api("/kitchen/food-ready", { method: "POST", body: { orderIds: [s.orderId] } }), siap, "Pesanan ditandai siap.");
    aksi.append(siap);
    box.append(aksi);
    return box;
}

function kartuGrup(g) {
    const card = el("section", "card stack");
    card.append(el("p", "label", `${tglPanjang(g.date)}${g.deliveryTime ? ` · ${g.deliveryTime.range} · ${g.deliveryTime.time}` : ""}`));
    g.menus.forEach(m => card.append(barisMenu(g, m)));
    if (g.ingredients.length) {
        card.append(el("h3", "t-h3", "Bahan yang dibutuhkan"), el("p", "t-muted", g.ingredients.map(i => `${i.name} ${angka(i.totalQuantity)} ${i.unit}`).join(" · ")));
    }
    if (g.specialCategory.length) {
        card.append(el("h3", "t-h3", "Perlu perhatian khusus"));
        g.specialCategory.forEach(s => card.append(kartuKhusus(s)));
    }
    return card;
}

let ke = 0;
async function muat() {
    const ini = ++ke;
    const t = $("#tgl").value || hariIni();
    cacheJadwal = new Map();
    try {
        const { data } = await api(`/kitchen/to-cook?from=${t}&to=${t}`);
        if (ini !== ke) return;
        $("#daftar").replaceChildren(...data.map(kartuGrup));
        $("#kosong").hidden = data.length > 0;
        galat(null);
    } catch (error) {
        if (ini !== ke) return;
        $("#daftar").replaceChildren();
        galat(error);
    } finally {
        $("#daftar").removeAttribute("aria-busy");
    }
}

let tunda;
const muatTertunda = () => { clearTimeout(tunda); tunda = setTimeout(muat, 300); };
$("#tgl").value = hariIni();
$("#tgl").addEventListener("change", muat);

let stream = null, menyambung = false;
async function sambung() {
    if (stream || menyambung) return;
    menyambung = true;
    try {
        if (!(await ensureToken())) return;
        stream = new EventSource(`${API_BASE}/realtime/stream?accessToken=${encodeURIComponent(store.token)}`);
        ["slot.status", "slot.menu", "slot.obstacle"].forEach(n => stream.addEventListener(n, muatTertunda));
        stream.onerror = async () => {
            stream.close();
            stream = null;
            await refreshSession();
            setTimeout(async () => { await sambung(); muatTertunda(); }, 5000);
        };
    } finally {
        menyambung = false;
    }
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) muatTertunda(); });
window.addEventListener("pagehide", () => stream && stream.close());
muat();
sambung();
</script></body></html>
