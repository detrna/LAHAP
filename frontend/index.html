<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pilih paket · LAHAP</title>
<meta name="description" content="Daftar paket katering langganan LAHAP beserta menu tujuh hari ke depan.">
<link rel="stylesheet" href="css/style.css"></head><body>
<header class="app-header"><div class="container"><a class="brand" href="landing.html">LAHAP</a><nav class="nav"></nav></div></header>
<main class="container stack-lg">
<div class="stack">
 <h1 class="t-h1">Pilih paket langgananmu</h1>
 <div class="field"><label for="cari">Cari paket</label><input class="input" id="cari" type="search" placeholder="Nama paket" autocomplete="off"></div>
</div>
<div class="alert alert--error" id="err" role="alert" hidden><span class="alert-title">Gagal memuat</span><span class="msg"></span> <button class="btn btn-secondary btn-sm" id="ulang" type="button">Coba lagi</button></div>
<p class="empty" id="kosongPaket" hidden></p>
<section class="grid grid-3" id="paket" aria-label="Daftar paket" aria-busy="true"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></section>
<div id="pager" hidden></div>
<section class="stack" id="boxMenu" hidden>
 <div><p class="label">Menu</p><h2 class="t-h2">Menu 7 hari ke depan</h2></div>
 <div class="alert alert--warning" id="galatMenu" role="status" hidden>Sebagian menu belum bisa dimuat. Muat ulang halaman untuk mencoba lagi.</div>
 <div class="tabs" id="tabs" role="group" aria-label="Pilih tanggal"></div>
 <div class="stack" id="isiMenu" aria-live="polite"></div>
</section>
<footer class="footer t-small" id="footer"><p><strong>LAHAP</strong> · Katering langganan untuk UMKM.</p></footer>
</main>
<script src="js/auth.js"></script>
<script src="js/katalog.js"></script>
<script>
const $ = selector => document.querySelector(selector);
const BATAS = 12;
let halaman = 1;
let urutan = 0;
let jeda = null;

async function muat() {
    const nomor = ++urutan;
    const cari = $("#cari").value.trim();
    $("#err").hidden = true;
    $("#kosongPaket").hidden = true;
    $("#paket").setAttribute("aria-busy", "true");
    const query = new URLSearchParams({ page: String(halaman), limit: String(BATAS) });
    if (cari) query.set("search", cari);
    let hasil;
    try {
        hasil = await api(`/packages?${query}`, { auth: false });
    } catch (error) {
        if (nomor !== urutan) return;
        $("#paket").replaceChildren();
        $("#paket").removeAttribute("aria-busy");
        $("#pager").hidden = true;
        $("#boxMenu").hidden = true;
        $("#err .msg").textContent = errorMessage(error);
        $("#err").hidden = false;
        return;
    }
    if (nomor !== urutan) return;
    const { data: daftar, meta } = hasil;
    $("#paket").removeAttribute("aria-busy");
    $("#paket").replaceChildren(...daftar.map(kartuPaket));
    $("#kosongPaket").textContent = cari
        ? "Tidak ada paket yang cocok dengan pencarian."
        : "Belum ada paket yang tersedia. Silakan cek lagi nanti.";
    $("#kosongPaket").hidden = daftar.length > 0;
    renderPager($("#pager"), meta, ke => {
        halaman = ke;
        muat();
        $("#paket").scrollIntoView({ block: "start", behavior: "smooth" });
    });
    const { daftar: menu, gagal } = await muatMenu(daftar);
    if (nomor !== urutan) return;
    $("#galatMenu").hidden = !gagal;
    pasangMenu({ box: $("#boxMenu"), tabs: $("#tabs"), isi: $("#isiMenu") }, menu, alergiSaya());
    if (gagal) $("#boxMenu").hidden = false;
}

$("#cari").addEventListener("input", () => {
    clearTimeout(jeda);
    jeda = setTimeout(() => {
        halaman = 1;
        muat();
    }, 300);
});
$("#ulang").onclick = muat;
pasangFooter($("#footer"));
muat();
</script></body></html>
