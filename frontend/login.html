<!doctype html>
<html lang="id">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Masuk · LAHAP</title>
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body>
        <header class="app-header">
            <div class="container">
                <a class="brand" href="index.html">LAHAP</a>
                <nav class="nav"></nav>
            </div>
        </header>
        <main class="container" style="max-width: 440px">
            <div class="stack-lg">
                <div>
                    <h1 class="t-h1" id="judul">Masuk ke LAHAP</h1>
                    <p class="t-muted">Pelanggan, admin, dapur, dan kurir masuk dari halaman yang sama.</p>
                </div>

                <form id="formMasuk" class="stack card" novalidate>
                    <div class="alert alert--error" id="errMasuk" hidden>
                        <span class="alert-title">Gagal masuk</span><span class="msg"></span>
                    </div>
                    <div class="field">
                        <label for="id">Nomor HP atau email</label>
                        <input class="input" id="id" autocomplete="username" />
                    </div>
                    <div class="field">
                        <label for="pw">Password</label>
                        <input class="input" id="pw" type="password" autocomplete="current-password" />
                    </div>
                    <button class="btn btn-primary btn-block" type="submit">Masuk</button>
                    <button class="btn btn-ghost btn-block" type="button" id="keDaftar">Belum punya akun? Daftar</button>
                </form>

                <form id="formDaftar" class="stack card" novalidate hidden>
                    <div class="alert alert--error" id="errDaftar" hidden>
                        <span class="alert-title">Gagal mendaftar</span><span class="msg"></span>
                    </div>
                    <div class="field" id="fHp">
                        <label for="dHp">Nomor HP</label>
                        <input class="input" id="dHp" inputmode="tel" placeholder="081234567890" />
                        <p class="error-msg" hidden>Nomor HP tidak valid. Contoh: 081234567890</p>
                    </div>
                    <div class="field" id="fPw">
                        <label for="dPw">Password</label>
                        <input class="input" id="dPw" type="password" autocomplete="new-password" />
                        <p class="hint">8 sampai 72 karakter.</p>
                        <p class="error-msg" hidden>Password harus 8 sampai 72 karakter.</p>
                    </div>
                    <div class="field" id="fUlang">
                        <label for="dUlang">Ulangi password</label>
                        <input class="input" id="dUlang" type="password" autocomplete="new-password" />
                        <p class="error-msg" hidden>Password tidak sama.</p>
                    </div>
                    <div class="field">
                        <label for="dNama">Nama (opsional)</label>
                        <input class="input" id="dNama" />
                    </div>
                    <div class="field">
                        <label for="dEmail">Email (opsional)</label>
                        <input class="input" id="dEmail" type="email" />
                    </div>
                    <button class="btn btn-primary btn-block" type="submit">Daftar</button>
                    <button class="btn btn-ghost btn-block" type="button" id="keMasuk">Sudah punya akun? Masuk</button>
                </form>
            </div>
        </main>
        <script src="js/auth.js"></script>
        <script>
            const $ = selector => document.querySelector(selector);

            if (currentUser()) location.href = homeFor(currentUser());

            function tampil(daftar) {
                $("#formMasuk").hidden = daftar;
                $("#formDaftar").hidden = !daftar;
                $("#judul").textContent = daftar ? "Daftar akun pelanggan" : "Masuk ke LAHAP";
            }

            function tampilError(box, message) {
                box.hidden = !message;
                box.querySelector(".msg").textContent = message || "";
            }

            async function kirim(form, aksi, box) {
                const tombol = form.querySelector("button[type=submit]");
                tombol.disabled = true;
                tampilError(box, "");
                try {
                    const user = await aksi();
                    location.href = homeFor(user);
                } catch (error) {
                    tampilError(box, errorMessage(error));
                } finally {
                    tombol.disabled = false;
                }
            }

            $("#keDaftar").onclick = () => tampil(true);
            $("#keMasuk").onclick = () => tampil(false);

            $("#formMasuk").addEventListener("submit", event => {
                event.preventDefault();
                kirim(event.target, () => login($("#id").value.trim(), $("#pw").value), $("#errMasuk"));
            });

            $("#formDaftar").addEventListener("submit", event => {
                event.preventDefault();
                const phone = $("#dHp").value.trim();
                const password = $("#dPw").value;
                const cek = [
                    ["#fHp", /^(\+?62|0)8\d{8,12}$/.test(phone)],
                    ["#fPw", password.length >= 8 && password.length <= 72],
                    ["#fUlang", password === $("#dUlang").value],
                ];
                cek.forEach(([selector, valid]) => {
                    $(selector).classList.toggle("is-error", !valid);
                    $(`${selector} .error-msg`).hidden = valid;
                });
                if (cek.some(([, valid]) => !valid)) return;
                const fields = { phone, password, confirmPassword: $("#dUlang").value };
                if ($("#dNama").value.trim()) fields.name = $("#dNama").value.trim();
                if ($("#dEmail").value.trim()) fields.email = $("#dEmail").value.trim();
                kirim(event.target, () => register(fields), $("#errDaftar"));
            });
        </script>
    </body>
</html>
