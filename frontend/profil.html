<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Profil · LAHAP</title><link rel="stylesheet" href="css/style.css"></head><body data-roles="pelanggan">
<header class="app-header"><div class="container"><a class="brand" href="index.html">LAHAP</a><nav class="nav"></nav></div></header>
<main class="container stack-lg">
<div><h1 class="t-h1">Profil</h1><p class="t-muted">Data dan alergi dipakai untuk peringatan menu.</p></div>
<div class="alert alert--info" id="ok" hidden><span class="alert-title">Tersimpan</span>Perubahan profil sudah disimpan.</div>
<form class="card stack" id="fProfil">
 <div class="field"><label for="nama">Nama</label><input class="input" id="nama" value="Budi Santoso"></div>
 <div class="field"><label for="hp">Nomor HP</label><input class="input" id="hp" value="081234567890"></div>
 <div class="field"><label for="email">Email (opsional)</label><input class="input" id="email" type="email"></div>
 <div class="field"><label for="alamat">Alamat</label><textarea class="textarea" id="alamat">Jl. Veteran 12, Malang</textarea></div>
 <div class="field"><span class="field-label">Alergi</span><div class="chip-group">
  <label class="chip"><input type="checkbox" checked>Telur</label><label class="chip"><input type="checkbox">Kacang</label><label class="chip"><input type="checkbox">Susu</label><label class="chip"><input type="checkbox">Seafood</label><label class="chip"><input type="checkbox">Gluten</label></div></div>
 <div class="field"><label for="catAlergi">Catatan alergi lain</label><input class="input" id="catAlergi"></div>
 <button class="btn btn-primary" type="submit">Simpan Perubahan</button>
</form>
<form class="card stack" id="fPw">
 <h2 class="t-h3">Ganti password</h2>
 <div class="field"><label for="pl">Password lama</label><input class="input" id="pl" type="password"></div>
 <div class="field" id="fBaru"><label for="pb">Password baru</label><input class="input" id="pb" type="password"><p class="error-msg" hidden>Minimal 8 karakter dan harus sama dengan ulangi password.</p></div>
 <div class="field"><label for="pu">Ulangi password baru</label><input class="input" id="pu" type="password"></div>
 <button class="btn btn-secondary" type="submit">Ganti Password</button>
</form>
</main><script src="js/auth.js"></script>
<script>
// Ganti dengan API ubah profil dan ganti password.
document.getElementById('fProfil').onsubmit=function(e){e.preventDefault();document.getElementById('ok').hidden=false;scrollTo(0,0)};
document.getElementById('fPw').onsubmit=function(e){e.preventDefault();
 var ok=pb.value.length>=8&&pb.value===pu.value;fBaru.classList.toggle('is-error',!ok);fBaru.querySelector('.error-msg').hidden=ok;
 if(ok){alert('Password diganti.');this.reset()}};
</script></body></html>
