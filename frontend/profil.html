<!doctype html>
<html lang="id">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Profil · LAHAP</title>
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body data-roles="pelanggan">
        <header class="app-header">
            <div class="container">
                <a class="brand" href="index.html">LAHAP</a>
                <nav class="nav"></nav>
            </div>
        </header>
        <main class="container stack-lg">
            <div>
                <h1 class="t-h1">Profil</h1>
                <p class="t-muted">Data dan alergi dipakai untuk peringatan menu.</p>
            </div>
            <div class="alert alert--error" id="errMuat" hidden><span class="alert-title">Gagal memuat</span><span class="msg"></span></div>
            <div class="alert alert--info" id="okProfil" hidden><span class="alert-title">Tersimpan</span><span class="msg"></span></div>

            <form class="card stack" id="fProfil" novalidate>
                <div class="alert alert--error" id="errProfil" hidden><span class="alert-title">Gagal menyimpan</span><span class="msg"></span></div>
                <div class="field">
                    <label for="nama">Nama</label>
                    <input class="input" id="nama" autocomplete="name" />
                </div>
                <div class="field">
                    <label for="hp">Nomor HP</label>
                    <input class="input" id="hp" inputmode="tel" autocomplete="tel" />
                </div>
                <div class="field">
                    <label for="email">Email (opsional)</label>
                    <input class="input" id="email" type="email" autocomplete="email" />
                </div>
                <div class="field">
                    <label for="alamat">Alamat</label>
                    <textarea class="textarea" id="alamat"></textarea>
                </div>
                <div class="field">
                    <span class="field-label">Alergi</span>
                    <div class="chip-group" id="alergi"></div>
                </div>
                <div class="field">
                    <label for="catAlergi">Catatan alergi lain</label>
                    <input class="input" id="catAlergi" />
                </div>
                <button class="btn btn-primary" type="submit">Simpan Perubahan</button>
            </form>

            <form class="card stack" id="fPw" novalidate>
                <h2 class="t-h3">Ganti password</h2>
                <div class="alert alert--error" id="errPw" hidden><span class="alert-title">Gagal mengganti password</span><span class="msg"></span></div>
                <div class="field">
                    <label for="pl">Password lama</label>
                    <input class="input" id="pl" type="password" autocomplete="current-password" />
                </div>
                <div class="field" id="fBaru">
                    <label for="pb">Password baru</label>
                    <input class="input" id="pb" type="password" autocomplete="new-password" />
                    <p class="hint">8 sampai 72 karakter. Setelah diganti, kamu perlu masuk lagi.</p>
                    <p class="error-msg" hidden>Password baru harus 8 sampai 72 karakter.</p>
                </div>
                <div class="field" id="fUlang">
                    <label for="pu">Ulangi password baru</label>
                    <input class="input" id="pu" type="password" autocomplete="new-password" />
                    <p class="error-msg" hidden>Password tidak sama.</p>
                </div>
                <button class="btn btn-secondary" type="submit">Ganti Password</button>
            </form>
        </main>
        <script src="js/auth.js"></script>
        <script>
            const $ = selector => document.querySelector(selector);

            function tampil(box, message) {
                box.hidden = !message;
                box.querySelector(".msg").textContent = message || "";
            }

            function isiForm(user) {
                $("#nama").value = user.name || "";
                $("#hp").value = user.phone || "";
                $("#email").value = user.email || "";
                $("#alamat").value = user.address || "";
                $("#catAlergi").value = user.allergyNote || "";
            }

            async function muat() {
                try {
                    const [profil, alergi] = await Promise.all([api("/me"), api("/allergies", { auth: false })]);
                    isiForm(profil.data);
                    const dipilih = new Set((profil.data.allergies || []).map(item => item.id));
                    alergi.data.forEach(item => {
                        const label = document.createElement("label");
                        label.className = "chip";
                        const input = document.createElement("input");
                        input.type = "checkbox";
                        input.value = item.id;
                        input.checked = dipilih.has(item.id);
                        label.append(input, item.name);
                        $("#alergi").append(label);
                    });
                } catch (error) {
                    tampil($("#errMuat"), errorMessage(error));
                }
            }

            $("#fProfil").addEventListener("submit", async event => {
                event.preventDefault();
                const tombol = event.target.querySelector("button[type=submit]");
                const body = {
                    allergyNote: $("#catAlergi").value.trim(),
                    allergyIds: [...document.querySelectorAll("#alergi input:checked")].map(input => input.value),
                };
                [
                    ["name", "#nama"],
                    ["phone", "#hp"],
                    ["email", "#email"],
                    ["address", "#alamat"],
                ].forEach(([key, selector]) => {
                    const value = $(selector).value.trim();
                    if (value) body[key] = value;
                });
                tombol.disabled = true;
                tampil($("#errProfil"), "");
                tampil($("#okProfil"), "");
                try {
                    const { data } = await api("/me", { method: "PATCH", body });
                    store.user = data;
                    isiForm(data);
                    tampil($("#okProfil"), "Perubahan profil sudah disimpan.");
                    scrollTo(0, 0);
                } catch (error) {
                    tampil($("#errProfil"), errorMessage(error));
                } finally {
                    tombol.disabled = false;
                }
            });

            $("#fPw").addEventListener("submit", async event => {
                event.preventDefault();
                const tombol = event.target.querySelector("button[type=submit]");
                const baru = $("#pb").value;
                const cek = [
                    ["#fBaru", baru.length >= 8 && baru.length <= 72],
                    ["#fUlang", baru === $("#pu").value],
                ];
                cek.forEach(([selector, valid]) => {
                    $(selector).classList.toggle("is-error", !valid);
                    $(`${selector} .error-msg`).hidden = valid;
                });
                tampil($("#errPw"), "");
                if (cek.some(([, valid]) => !valid)) return;
                tombol.disabled = true;
                try {
                    await api("/me/password", { method: "PUT", body: { currentPassword: $("#pl").value, newPassword: baru } });
                    store.token = null;
                    store.user = null;
                    alert("Password diganti. Silakan masuk lagi.");
                    location.href = "login.html";
                } catch (error) {
                    tampil($("#errPw"), error.code === "INVALID_STATE" ? "Password lama salah." : errorMessage(error));
                    tombol.disabled = false;
                }
            });

            muat();
        </script>
    </body>
</html>
