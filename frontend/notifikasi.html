<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notifikasi · LAHAP</title><link rel="stylesheet" href="css/style.css"></head><body data-roles="pelanggan,admin,kurir">
<header class="app-header"><div class="container"><a class="brand" id="beranda" href="index.html">LAHAP</a><nav class="nav"></nav></div></header>
<main class="container stack-lg">
<div class="row-between"><div><h1 class="t-h1" id="judul">Notifikasi</h1><p class="t-muted" id="keterangan" hidden></p></div><button class="btn btn-secondary" id="semua" type="button" disabled>Tandai Semua Dibaca</button></div>
<div class="alert alert--error" id="err" role="alert" hidden><span class="alert-title">Gagal</span><span class="msg"></span></div>
<div class="chip-group" id="filter" role="radiogroup" aria-label="Filter notifikasi"><label class="chip"><input type="radio" name="f" value="" checked>Semua</label><label class="chip"><input type="radio" name="f" value="false">Belum dibaca</label><label class="chip"><input type="radio" name="f" value="true">Sudah dibaca</label></div>
<section class="stack"><p class="t-muted" id="kosong" hidden>Belum ada notifikasi.</p><div class="stack" id="notif" aria-live="polite" aria-busy="true"><div class="skeleton"></div><div class="skeleton"></div></div><div id="pager" hidden></div></section>
<section class="stack" id="boxInfo" hidden><h2 class="t-h2">Pengumuman</h2><div class="stack" id="info" aria-live="polite"></div><div id="pagerInfo" hidden></div></section>
</main>
<script type="module" src="js/pages/notifikasi.js"></script></body></html>
