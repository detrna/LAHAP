<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Akun · LAHAP</title><link rel="stylesheet" href="css/style.css"></head><body data-roles="admin,dapur,kurir">
<header class="app-header"><div class="container"><a class="brand" id="beranda" href="login.html">LAHAP</a><nav class="nav"></nav></div></header>
<main class="container stack-lg">
<div><h1 class="t-h1">Akun</h1><p class="t-muted" id="siapa"></p></div>
<form class="card stack" id="fPw" novalidate>
 <h2 class="t-h3">Ganti password</h2>
 <div class="alert alert--error" id="errPw" role="alert" hidden><span class="alert-title">Gagal mengganti password</span><span class="msg"></span></div>
 <div class="field" id="fLama"><label for="pl">Password lama</label><input class="input" id="pl" type="password" autocomplete="current-password"><p class="error-msg" hidden>Isi password lama.</p></div>
 <div class="field" id="fBaru"><label for="pb">Password baru</label><input class="input" id="pb" type="password" autocomplete="new-password"><p class="hint">8 sampai 72 karakter. Setelah diganti, kamu perlu masuk lagi di semua perangkat.</p><p class="error-msg" hidden>Password baru harus 8 sampai 72 karakter.</p></div>
 <div class="field" id="fUlang"><label for="pu">Ulangi password baru</label><input class="input" id="pu" type="password" autocomplete="new-password"><p class="error-msg" hidden>Password tidak sama.</p></div>
 <button class="btn btn-primary" type="submit">Ganti Password</button>
</form>
</main><script src="js/auth.js"></script>
<script>
const $ = s => document.querySelector(s);
const PERAN = { ADMIN: "Admin", KITCHEN: "Dapur", COURIER: "Kurir" };
function tampil(box, message) { box.hidden = !message; box.querySelector(".msg").textContent = message || ""; }
const user = currentUser();
if (user) {
    $("#siapa").textContent = `${user.name} · ${PERAN[user.role] || user.role}`;
    $("#beranda").href = homeFor(user);
}
$("#fPw").addEventListener("submit", async event => {
    event.preventDefault();
    const tombol = event.target.querySelector("button[type=submit]");
    const baru = $("#pb").value;
    const cek = [["#fLama", $("#pl").value !== ""], ["#fBaru", baru.length >= 8 && baru.length <= 72 && new TextEncoder().encode(baru).length <= 72], ["#fUlang", baru === $("#pu").value]];
    let pertama = null;
    cek.forEach(([selector, valid]) => {
        $(selector).classList.toggle("is-error", !valid);
        $(`${selector} .error-msg`).hidden = valid;
        const input = $(`${selector} input`);
        input.setAttribute("aria-invalid", String(!valid));
        if (!valid && !pertama) pertama = input;
    });
    tampil($("#errPw"), "");
    if (pertama) return pertama.focus();
    tombol.disabled = true;
    try {
        await api("/me/password", { method: "PUT", body: { currentPassword: $("#pl").value, newPassword: baru } });
        clearSession();
        toast("Password diganti. Silakan masuk lagi.");
        setTimeout(() => location.replace("login.html"), 1200);
    } catch (error) {
        tampil($("#errPw"), error.code === "INVALID_STATE" ? "Password lama salah." : errorMessage(error));
        tombol.disabled = false;
    }
});
</script></body></html>
