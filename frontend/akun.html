<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Akun · LAHAP</title><link rel="stylesheet" href="css/style.css"></head><body data-roles="admin,dapur,kurir">
<header class="app-header"><div class="container"><a class="brand" id="beranda" href="login.html">LAHAP</a><nav class="nav"></nav></div></header>
<main class="container stack-lg">
<div><h1 class="t-h1">Akun</h1><p class="t-muted" id="siapa"></p></div>
<form class="card stack" id="fPw" novalidate>
 <h2 class="t-h3">Ganti password</h2>
 <div class="alert alert--error" id="errPw" role="alert" hidden><span class="alert-title">Gagal mengganti password</span><span class="msg"></span></div>
 <div class="field" id="fLama"><label for="pl">Password lama</label><input class="input" id="pl" type="password" autocomplete="current-password"><p class="error-msg" hidden>Isi password lama.</p></div>
 <div class="field" id="fBaru"><label for="pb">Password baru</label><input class="input" id="pb" type="password" autocomplete="new-password"><p class="hint">8 sampai 72 karakter. Setelah diganti, kamu perlu masuk lagi di semua perangkat.</p><p class="error-msg" hidden>Password baru harus 8 sampai 72 karakter.</p></div>
 <div class="field" id="fUlang"><label for="pu">Ulangi password baru</label><input class="input" id="pu" type="password" autocomplete="new-password"><p class="error-msg" hidden>Password tidak sama.</p></div>
 <button class="btn btn-primary" type="submit">Ganti Password</button>
</form>
</main><script type="module" src="js/pages/akun.js"></script></body></html>
