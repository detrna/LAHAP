<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stok bahan · LAHAP</title><link rel="stylesheet" href="css/style.css"></head><body data-roles="dapur,admin">
<header class="app-header"><div class="container"><a class="brand" href="dapur.html">LAHAP</a><nav class="nav"></nav></div></header>
<main class="container stack-lg">
<div><h1 class="t-h1">Stok bahan</h1><p class="t-muted">Perbarui stok hasil hitung manual, atau perkirakan dari foto wadah bahan.</p></div>
<div class="alert alert--error" id="err" role="alert" hidden><span class="alert-title">Gagal</span><span class="msg"></span></div>
<div class="row">
<div class="field flex-1"><label for="cari">Cari bahan</label><input class="input" id="cari" type="search" autocomplete="off"></div>
<div class="chip-group"><label class="chip"><input type="checkbox" id="menipis">Hanya yang menipis</label></div>
</div>
<section class="card" id="daftar" aria-busy="true"><div class="skeleton"></div></section>
<p class="empty" id="kosong" hidden>Tidak ada bahan yang cocok.</p>
<div id="pager" hidden></div>
<section class="card stack" id="riwayat" hidden><h2 class="t-h3" id="judulRiwayat">Riwayat perubahan stok</h2><div id="isiRiwayat"></div><div id="pagerRiwayat" hidden></div></section>
</main><script src="js/auth.js"></script>
<script>
const $ = s => document.querySelector(s);
const angka = n => Number(n).toLocaleString("id-ID", { maximumFractionDigits: 2 });
const waktu = s => new Date(s).toLocaleString("id-ID", { timeZone: "Asia/Jakarta", day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
const el = (tag, c, t) => { const n = document.createElement(tag); if (c) n.className = c; if (t !== undefined) n.textContent = t; return n; };
function galat(error) { $("#err").hidden = !error; if (error) $("#err .msg").textContent = errorMessage(error); }

const BATAS = 20;
let bahan = [];
let halaman = 1;
let riwayatAktif = null;

async function riwayat(b, page = 1) {
    try {
        const { data, meta } = await api(`/kitchen/ingredients/${b.id}/stock-history?page=${page}&limit=10`);
        riwayatAktif = b.id;
        $("#judulRiwayat").textContent = `Riwayat stok ${b.name}`;
        $("#isiRiwayat").replaceChildren(...(data.length ? data.map(h => {
            const slot = el("div", "slot");
            const kiri = el("div");
            kiri.append(
                el("p", "t-h3", `${angka(h.previousStock)} ${b.unit} menjadi ${angka(h.newStock)} ${b.unit}`),
                el("p", "t-small t-muted", `Selisih ${h.delta > 0 ? "+" : ""}${angka(h.delta)} · ${h.changedBy ? h.changedBy.name : "-"} · ${waktu(h.changedAt)}`),
            );
            slot.append(kiri);
            return slot;
        }) : [el("p", "t-muted", "Belum ada riwayat.")]));
        renderPager($("#pagerRiwayat"), meta, ke => riwayat(b, ke));
        $("#riwayat").hidden = false;
        if (page === 1) $("#riwayat").scrollIntoView({ block: "nearest", behavior: "smooth" });
    } catch (error) { galat(error); }
}

function panelFoto(b, inputStok, tombolSimpan) {
    const panel = el("div", "alert alert--info stack");
    panel.style.flexBasis = "100%";
    panel.hidden = true;
    const idFoto = `foto-${b.id}`;
    const idIsi = `isi-${b.id}`;
    panel.append(el("span", "alert-title", `Perkirakan ${b.name} dari foto`));
    const fieldFoto = el("div", "field");
    const labelFoto = el("label", "", "Foto wadah bahan");
    labelFoto.htmlFor = idFoto;
    const foto = el("input", "input");
    Object.assign(foto, { id: idFoto, type: "file", accept: "image/jpeg,image/png,image/webp" });
    fieldFoto.append(labelFoto, foto, el("p", "hint", "JPEG, PNG, atau WebP. Pastikan semua wadah terlihat."));
    const fieldIsi = el("div", "field");
    const labelIsi = el("label", "", `Isi per wadah (${b.unit})`);
    labelIsi.htmlFor = idIsi;
    const isi = el("input", "input w-num");
    Object.assign(isi, { id: idIsi, type: "number", min: "0", step: "any", value: "1" });
    isi.inputMode = "decimal";
    fieldIsi.append(labelIsi, isi, el("p", "hint", `Foto menghitung jumlah wadah, bukan ${b.unit}. Contoh: botol 1,5 liter diisi 1,5.`));
    const hasil = el("p", "", "");
    hasil.hidden = true;
    const aksi = el("div", "row");
    const perkirakan = el("button", "btn btn-secondary btn-sm", "Perkirakan");
    perkirakan.type = "button";
    const pakai = el("button", "btn btn-primary btn-sm", "Pakai angka ini");
    pakai.type = "button";
    pakai.hidden = true;
    aksi.append(perkirakan, pakai);
    panel.append(fieldFoto, fieldIsi, hasil, aksi);

    let jumlahWadah = null;
    const perkiraan = () => {
        const per = parseFloat(isi.value);
        return Number.isFinite(per) && per > 0 ? Math.round(jumlahWadah * per * 100) / 100 : null;
    };
    const tulisHasil = () => {
        if (jumlahWadah === null) return;
        const total = perkiraan();
        hasil.textContent = total === null
            ? `Terlihat ${angka(jumlahWadah)} wadah. Isi per wadah dulu untuk menghitung stok.`
            : `Terlihat ${angka(jumlahWadah)} wadah × ${angka(isi.value)} ${b.unit} = ${angka(total)} ${b.unit}.`;
        hasil.hidden = false;
        pakai.hidden = total === null;
    };
    isi.addEventListener("input", tulisHasil);
    perkirakan.onclick = async () => {
        const file = foto.files[0];
        if (!file) { foto.focus(); return toast("Pilih foto dulu.", "error"); }
        perkirakan.disabled = true;
        perkirakan.textContent = "Memperkirakan...";
        galat(null);
        try {
            const body = new FormData();
            body.append("image", file);
            const { data } = await api(`/kitchen/ingredients/${b.id}/photo-estimate`, { method: "POST", body, timeout: 60000 });
            jumlahWadah = data.estimatedQuantity;
            tulisHasil();
        } catch (error) { galat(error); }
        finally { perkirakan.disabled = false; perkirakan.textContent = "Perkirakan"; }
    };
    pakai.onclick = () => {
        const total = perkiraan();
        if (total === null) return isi.focus();
        inputStok.value = total;
        tombolSimpan.focus();
        toast("Angka dimasukkan. Tekan Simpan untuk menyimpan.");
    };
    return panel;
}

function baris(b) {
    const row = el("div", "invoice");
    const kiri = el("div");
    kiri.append(el("p", "t-h3", b.name), el("p", "t-small t-muted", `Stok ${angka(b.stock)} ${b.unit} · batas minimum ${angka(b.minimumThreshold)} ${b.unit}`));
    const kanan = el("div", "row");
    const badge = el("span", `badge ${b.isLowStock ? "badge--pending" : "badge--success"}`, b.isLowStock ? "Menipis" : "Cukup");
    const input = el("input", "input w-num");
    Object.assign(input, { type: "number", min: "0", step: "any", value: b.stock });
    input.id = `stok-${b.id}`;
    input.setAttribute("aria-label", `Stok ${b.name} (${b.unit})`);
    input.inputMode = "decimal";
    const simpan = el("button", "btn btn-secondary btn-sm", "Simpan");
    simpan.type = "button";
    simpan.onclick = async () => {
        const nilai = parseFloat(input.value);
        if (!Number.isFinite(nilai) || nilai < 0) {
            input.setAttribute("aria-invalid", "true");
            input.focus();
            return toast("Isi stok dengan angka 0 atau lebih.", "error");
        }
        input.removeAttribute("aria-invalid");
        simpan.disabled = true;
        galat(null);
        try {
            const { data } = await api(`/kitchen/ingredients/${b.id}/stock`, { method: "PUT", body: { stock: nilai } });
            Object.assign(b, data);
            toast(`Stok ${b.name.toLowerCase()} disimpan.`);
            gambar();
            if (riwayatAktif === b.id) riwayat(b);
        } catch (error) { galat(error); simpan.disabled = false; }
    };
    const lihat = el("button", "btn btn-ghost btn-sm", "Riwayat");
    lihat.type = "button";
    lihat.onclick = () => riwayat(b);
    const tombolFoto = el("button", "btn btn-ghost btn-sm", "Dari Foto");
    tombolFoto.type = "button";
    tombolFoto.setAttribute("aria-expanded", "false");
    const panel = panelFoto(b, input, simpan);
    tombolFoto.onclick = () => {
        panel.hidden = !panel.hidden;
        tombolFoto.setAttribute("aria-expanded", String(!panel.hidden));
    };
    kanan.append(badge, input, simpan, lihat, tombolFoto);
    row.append(kiri, kanan, panel);
    return row;
}

function gambar() {
    $("#daftar").replaceChildren(...bahan.map(baris));
    $("#daftar").hidden = bahan.length === 0;
    $("#kosong").hidden = bahan.length > 0;
}

let ke = 0;
async function muat(page = halaman) {
    const ini = ++ke;
    const query = new URLSearchParams({ page: String(page), limit: String(BATAS) });
    const kata = $("#cari").value.trim();
    if (kata) query.set("search", kata);
    if ($("#menipis").checked) query.set("lowStock", "true");
    $("#daftar").setAttribute("aria-busy", "true");
    try {
        const { data, meta } = await api(`/kitchen/ingredients?${query}`);
        if (ini !== ke) return;
        bahan = data;
        halaman = meta.page;
        gambar();
        renderPager($("#pager"), meta, muat);
        galat(null);
    } catch (error) {
        if (ini !== ke) return;
        $("#daftar").replaceChildren();
        $("#pager").hidden = true;
        galat(error);
    } finally {
        if (ini === ke) $("#daftar").removeAttribute("aria-busy");
    }
}

let tunda;
$("#cari").addEventListener("input", () => { clearTimeout(tunda); tunda = setTimeout(() => muat(1), 300); });
$("#menipis").addEventListener("change", () => muat(1));
muat(1);
</script></body></html>
